name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      # The rendered layer and the raster assets need a real browser; without
      # one those tests skip, and a green run would prove less than it says.
      - run: python -m playwright install --with-deps chromium
      - run: pytest -rs
